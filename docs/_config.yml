# GenSep documentation site — Just the Docs theme, built by GitHub Pages
# (remote_theme, no local build step). Theme docs: https://just-the-docs.com

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

title: GenSep
description: "Quantifying the genetic separability of disease subtypes — oracle & finite-PRS case–case AUC from GWAS summaries or h2/rg estimates."
url: https://chaoning.github.io
baseurl: /gensep

# Theme options
color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  tokenizer_separator: /[\s/]+/
  button: false
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"
nav_enabled: true

aux_links:
  "GenSep on GitHub": "https://github.com/chaoning/gensep"
aux_links_new_tab: true

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow

footer_content: "GenSep is free software under the <a href=\"https://www.gnu.org/licenses/gpl-3.0.html\">GPL-3.0</a>. Questions: <a href=\"https://github.com/chaoning/gensep/issues\">GitHub issues</a> or chao.ning@qgg.au.dk."

# Every page uses the theme's default layout unless it says otherwise
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - LICENSE.md
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
